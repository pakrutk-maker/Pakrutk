<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>예시1- 레이아웃을 div로 나누기</title>
    <style>
      *{box-sizing:vorder-box;}
      body {font-family:sans-serif: margin: 0;
      .header {background:#4a90e2; color: white; padding:20px; text-align:center;}
      .nav {background:#333; padding: 10px;}
      .nav a {colr:white; margin: 0 15px; text-decoration:none;}
      .container {display:flex;}
      .main {background:#f4f4f4; padding 20px; flex: 3;}
      .sidebar {background:#dcdcdc; padding: 20px; flex: 1;}
      .footer {background:#333; color: white; text-align: center; padding: 10px;}
    </style>
  </head>
  <body>
    <!--1.헤더 영역-->
    <div class="header">
      <h1>내 웹사이트</h1>
    </div>

    <!--2. 네비게이션 영역-->
    <div class="nav">
      <a href="#">홈</a>
       <a href="#">소개</a>
       <a href="#">연락처</a>
    </div>

    <!--3.본문+사이드바를 감싸는 큰 div-->
    <div class="container">

      <!--3-2.사이드바 영역-->
      <div class="main">
        <h2>본문 내용</h2>
        <p>이 부분에 주요 글이나 이미지가 들어갑니다.</p>
      </div>

      <!--3-2. 사이드 영역-->
      <div class="sidebar">
        <h3>사이드바</h3>
        <p>공지, 광고,링크목록 등</p>
      </div>

      <div>
        <!--4.푸터 영역-->
        <div class="footer">
          <p>&copy;2026내 웹사이트</p>
      </div>
        
  </body>
      </html>
