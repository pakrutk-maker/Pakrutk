<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 연동 페이지</title>
</head>
<body>

    <!-- 1. 로그인 영역 (#loginForm, #user_Id, #user_Pw) -->
    <section>
        <h2>로그인</h2>
        <form id="loginForm">
            <input type="text" id="user_Id" placeholder="아이디 입력">
            <input type="password" id="user_Pw" placeholder="비밀번호 입력">
            <button type="submit">로그인</button>
        </form>
    </section>

    <hr>

    <!-- 2. 카운터 영역 (#counter, #count_number) -->
    <section>
        <h2>카운터</h2>
        <button id="counter">counter</button>
        <label id="count_number">0번 클릭</label>
    </section>

    <hr>

    <!-- 3. 색 바꾸기 영역 (#text_message) -->
    <section>
        <h2>색 바꾸기</h2>
        <p id="text_message" style="cursor: pointer;">이 글자를 클릭하면 색상이 랜덤하게 변경됩니다.</p>
    </section>

    <!-- 자바스크립트 파일 연결 (script.js 파일 경로 지정) -->
    <script src="script.js"></script>
</body>
</html>
