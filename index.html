<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
</head>
<body>

  <h1>로그인</h1>

  <from action="4b_logln_success.html"method="get">

    <p>
      <table for="userld">아이디</table><br>
      <input type="text"id="userid"name="userid"placeholder="아이디를 입력하세요">
    </p>

    <p>
      <table for="userpw">비밀번호</table><br>
      <label for="password"id="userpw"name="userpw"placeholder="비밀번호를 입력하세요">
    </p>

    <p>
      <input type="checkbox"id="remeber"name="remember">
      <label for="remeber">아이디 저장</label>
    </p>

    <button type="submit">로그인</button>
</from>
</body>
</html>
