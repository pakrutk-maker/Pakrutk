<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 추천 사이트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 1. 본문 영역 (전체 너비의 80% 차지) -->
        <main class="main-content">
            <!-- 3. 헤더 영역 (영화 제목/감독 검색) -->
            <header class="header-area">
                <input type="text" placeholder="원하는 영화 제목이나 감독 이름을 검색하세요">
                <button type="button">검색</button>
            </header>

            <!-- 4. 콘텐츠 구성 (랜덤 영화 추천 카드 목록) -->
            <section class="content-area">
                <div class="movie-card">랜덤 추천 영화 1</div>
                <div class="movie-card">랜덤 추천 영화 2</div>
                <div class="movie-card">랜덤 추천 영화 3</div>
                <div class="movie-card">랜덤 추천 영화 4</div>
            </section>
        </main>

        <!-- 2. 사이드 메뉴 영역 (전체 너비의 20% 차지) -->
        <aside class="sidebar-area">
            <!-- 5. 관심 영역 (원하는 장르만 추천해주는 동그라미 버튼) -->
            <div class="interest-area">
                <div class="genre-item">액션</div>
                <div class="genre-item">스릴러</div>
                <div class="genre-item">SF</div>
                <div class="genre-item">코미디</div>
            </div>

            <!-- 2. 사이드 메뉴 (로그인, 회원가입, 사이트 접근) -->
            <nav class="side-menu">
                <a href="#">로그인</a>
                <a href="#">회원가입</a>
                <a href="#">사이트 소개</a>
                <a href="#">마이페이지</a>
            </nav>
        </aside>
    </div>
</body>
</html>
